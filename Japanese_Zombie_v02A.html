const KEY='jp-zombie-v02a',OLD='jp-zombie-v1';let state;function fresh(){return {coins:120,favorites:[],studied:[],events:[],owned:[],equipped:[],sessions:0,history:[],dailySeen:'',version:2}}try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=fresh()};try{if(!localStorage.getItem(KEY)){let old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){state.coins=old.coins??120;let mapping={'apple':'りんご','cat':'猫','dog':'犬','water':'水','sky':'空','book':'本','train':'電車','vegetable':'野菜','school':'学校','today':'今日'};let mapId=v=>WORDS.find(w=>w.jp===mapping[v])?.id;state.studied=[...new Set((old.learned||[]).map(mapId).filter(Boolean))];for(let e of old.records||[]){let id=mapId(e.id);if(id)state.events.push({id,type:e.mode==='choice'?'quiz':'battle',correct:!!e.correct,time:e.elapsed||0,at:Date.now(),migrated:true})}}}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('儲存空間不足，進度可能無法保存')}};persist();let screen='home',category='全部',query='',filter='all',page=0,selected=null,quiz=null,battle=null,quizCat='全部',battleCat='全部',battleMode='flick',typed='',touch=null,actionLock=false,storyStep=0;
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const randomize=a=>[...a].sort(()=>Math.random()-.5);const catOpts=()=>['全部',...CATS].map(c=>`<option ${c===quizCat?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('');const nowDay=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let timerHandle;function toast(t){let el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(timerHandle);timerHandle=setTimeout(()=>el.style.display='none',2400)}
function heading(){return `<div class="top"><div><div class="title">🐾 日文喪屍生存戰</div><div class="muted small">v0.2A · 學習圖鑑 · 本機進度</div></div><div class="chips"><span class="chip">🪙 ${state.coins}</span><span class="chip">📚 ${WORDS.length}項</span></div></div>`}
function tabs(){return `<nav class="tabs">${[['home','首頁','🏠'],['catalog','圖鑑','📖'],['quiz','問答','🧠'],['battle','喪屍','🧟'],['record','紀錄','📊'],['pet','伙伴','🐱']].map(([s,n,i])=>`<button class="tab ${screen===s?'on':''}" onclick="go('${s}')"><span>${i}</span>${n}</button>`).join('')}</nav>`}
function render(){let html=screen==='home'?home():screen==='catalog'?catalog():screen==='detail'?detail():screen==='quiz'?quizHome():screen==='quizplay'?quizView():screen==='quizresult'?quizResult():screen==='battle'?battleHome():screen==='battleplay'?battleView():screen==='battleresult'?battleResult():screen==='record'?records():screen==='pet'?pet():screen==='story'?story():home();$('app').innerHTML=heading()+html+tabs();if(screen==='battleplay')installKeys()}
function go(s){screen=s;selected=null;page=0;render();window.scrollTo(0,0)}
function festival(){let d=nowDay().slice(5),events={'01-01':['元日','がんじつ','日本新年，習俗包括初詣同御節料理。'],'02-03':['節分','せつぶん','傳統上用撒豆驅邪迎春；日期有時會變動。'],'03-03':['ひな祭り','ひなまつり','女兒節，傳統會擺放雛人形。'],'05-05':['こどもの日','こどものひ','日本國民祝日；部分家庭會掛鯉魚旗。'],'07-07':['七夕','たなばた','寫願望短冊，掛喺竹枝上。'],'11-03':['文化の日','ぶんかのひ','國民祝日，強調自由、和平同文化。'],'11-15':['七五三','しちごさん','為兒童成長祈福嘅傳統儀式。'],'12-31':['大晦日','おおみそか','除夕，傳統上會食年越蕎麥麵。']}[d];if(!events)return '';return `<div class="panel"><div class="tag">🎎 今日の日本文化 · ${d}</div><h2 style="margin-top:10px">🐱 「今日は${events[0]}だよ！」</h2><div class="readingblock">${events[1]}</div><p>${events[2]}</p><p class="small muted">文化小知識僅供學習；法定假期／節分日期等應以該年官方資料為準。</p><button class="btn line" onclick="go('catalog')">去圖鑑睇相關詞彙</button></div>`}
function home(){let done=new Set(state.studied).size;return `<section class="panel hero"><span class="tag">第一章 · 便利店求生</span><h1>每學識一個詞，<br>就拯救多一個人。🌟</h1><div class="mascot">🐈</div><p style="text-align:center">「今日都一齊練日文啦！」</p><div class="grid"><button class="btn" onclick="go('catalog')">📖 學習圖鑑</button><button class="btn gold" onclick="go('battle')">🧟 開始戰鬥</button></div></section>${festival()}<section class="panel"><h2>你嘅學習進度</h2><div class="stats"><div><b>${done}</b><span class="small">已睇單字</span></div><div><b>${state.events.length}</b><span class="small">練習題數</span></div><div><b>${state.favorites.length}</b><span class="small">收藏單字</span></div></div><div class="separator"></div><p class="muted small">完整字庫隨時可查閱；遊戲可以揀指定分類。下次開啟時，本機紀錄會自動載入。</p><button class="btn alt" onclick="go('record')">📊 查看弱點同最近遇過嘅詞</button></section><section class="panel"><h2>🏪 便利店故事</h2><p>幫小貓向店員買水，學幾句真正用得著嘅日文。</p><button class="btn alt" onclick="go('story')">進入故事</button></section>`}
function listFiltered(){return WORDS.filter(w=>(category==='全部'||w.cat===category)&&(!query||[w.jp,w.reading,w.zh].join(' ').toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||(filter==='fav'?state.favorites.includes(w.id):filter==='studied'?state.studied.includes(w.id):filter==='seen'?state.events.some(e=>e.id===w.id):filter==='wrong'?state.events.some(e=>e.id===w.id&&!e.correct):true)))}
function catalog(){let arr=listFiltered(),slice=arr.slice(page*18,(page+1)*18);return `<section class="panel"><h2>📖 日本語圖鑑</h2><p class="muted small">${WORDS.length}項 · ${CATS.length}個分類。可搜尋、收藏、選擇範圍再開始練習。</p><input aria-label="搜尋單字" class="search" value="${esc(query)}" placeholder="搜尋日文／假名／中文，例如：星期、がっこう" oninput="changeSearch(this.value)"><div class="row wrap" style="margin-top:11px">${['all','fav','studied','seen','wrong'].map((x,i)=>`<button class="pill ${filter===x?'on':''}" onclick="setFilter('${x}')">${['全部','⭐ 收藏','📘 已學','🎮 遇過','❗答錯'][i]}</button>`).join('')}</div><div class="separator"></div><div class="grid">${['全部',...CATS].map(c=>`<button class="tile ${category===c?'selected':''}" onclick="setCategory('${esc(c)}')"><div class="emoji">${ICONS[c]||'📚'}</div><strong>${esc(c)}</strong><div class="small muted">${c==='全部'?WORDS.length:WORDS.filter(w=>w.cat===c).length}項</div></button>`).join('')}</div></section><section class="panel"><div class="row between"><h2 style="margin:0">${esc(category)}</h2><span class="small muted">${arr.length}項結果</span></div>${slice.map(w=>wordrow(w)).join('')||'<div class="empty">暫時冇符合條件嘅單字</div>'}<div class="paging"><button class="btn alt" ${page<=0?'disabled':''} onclick="changePage(-1)">← 上頁</button><span class="small">${Math.min(page+1,Math.max(1,Math.ceil(arr.length/18)))}/${Math.max(1,Math.ceil(arr.length/18))}</span><button class="btn alt" ${((page+1)*18>=arr.length)?'disabled':''} onclick="changePage(1)">下頁 →</button></div><button class="btn" style="width:100%" onclick="practiceCategory()">🧠 練習目前分類</button></section>`}
function wordrow(w){let seen=state.events.filter(e=>e.id===w.id),wrong=seen.filter(e=>!e.correct).length;return `<div class="word"><div class="main" onclick="openWord('${w.id}')" role="button" tabindex="0"><div class="jp">${esc(w.jp)} <span class="reading">${esc(w.reading)}</span></div><div class="sub">${esc(w.zh)} ${seen.length?' · '+seen.length+'題'+(wrong?' · 錯'+wrong:''):''}</div></div><button aria-label="收藏" class="star" onclick="toggleFavorite('${w.id}')">${state.favorites.includes(w.id)?'⭐':'☆'}</button><button aria-label="單字詳細" class="star" onclick="openWord('${w.id}')">›</button></div>`}
function changeSearch(q){query=q;page=0;let p=$('app').querySelector('section.panel:nth-of-type(2)');let a=listFiltered();if(p){p.outerHTML=renderResults(a)}else render()}
function renderResults(arr){return `<section class="panel"><div class="row between"><h2>${esc(category)}</h2><span class="small muted">${arr.length}項結果</span></div>${arr.slice(page*18,(page+1)*18).map(wordrow).join('')||'<div class="empty">暫時冇符合條件嘅單字</div>'}<div class="paging"><button class="btn alt" ${page<=0?'disabled':''} onclick="changePage(-1)">← 上頁</button><span class="small">${page+1}/${Math.max(1,Math.ceil(arr.length/18))}</span><button class="btn alt" ${(page+1)*18>=arr.length?'disabled':''} onclick="changePage(1)">下頁 →</button></div><button class="btn" style="width:100%" onclick="practiceCategory()">🧠 練習目前分類</button></section>`}
function setFilter(x){filter=x;page=0;render()}function setCategory(x){category=x;page=0;render()}function changePage(n){page+=n;render();window.scrollTo(0,250)}function openWord(id){selected=id;screen='detail';render();window.scrollTo(0,0)}function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();render()}
const EXAMPLES={'動詞':['毎日、日本語を勉強します。','每日都學日文。'],'食物與飲品':['これはおいしいです。','呢個好好食。'],'交通與購物':['駅はどこですか。','車站喺邊度？'],'日期與時間':['今日は月曜日です。','今日係星期一。'],'數字與數量':['りんごが三つあります。','有三個蘋果。'],'量詞':['二人で行きます。','兩個人一齊去。'],'人物與生活':['これは私の本です。','呢本係我嘅書。'],'形容詞與表達':['今日は暑いです。','今日好熱。'],'常用短語':['ありがとうございます。','多謝。']};
function detail(){let w=BYID[selected];if(!w)return catalog();let ev=state.events.filter(x=>x.id===w.id),ok=ev.filter(x=>x.correct).length;let example=EXAMPLES[w.cat]||[];return `<section class="panel"><button class="btn line" onclick="go('catalog')">← 返回圖鑑</button><div style="height:17px"></div><span class="tag">${esc(w.cat)}</span><div class="focus">${esc(w.jp)}</div><p style="text-align:center;color:var(--mint);font-size:20px">${esc(w.reading)}</p><h2 style="text-align:center">${esc(w.zh)}</h2><div class="separator"></div><div class="row wrap"><button class="btn alt" onclick="toggleFavorite('${w.id}')">${state.favorites.includes(w.id)?'⭐ 已收藏':'☆ 加入收藏'}</button><button class="btn" onclick="markStudy('${w.id}')">${state.studied.includes(w.id)?'📘 再複習一次':'✓ 標記已學'}</button></div><div class="separator"></div><h3>相關例句（分類示例）</h3><p>${esc(example[0])}</p><p class="muted">${esc(example[1])}</p><p class="small muted">註：目前例句係按類別提供嘅示例，未必直接包含呢個詞；逐詞專屬例句及語法校對會喺下一階段補完。</p><div class="separator"></div><h3>學習紀錄</h3><p class="muted">遇過 ${ev.length} 次 · 答啱 ${ok} 次 · 答錯 ${ev.length-ok} 次</p><button class="btn gold" onclick="practiceOne('${w.id}')">🧠 練習呢個詞</button></section>`}
function markStudy(id){if(!state.studied.includes(id)){state.studied.push(id);state.coins+=2;toast('學習完成！＋2積分')}else toast('已紀錄再次複習');persist();render()}
function pools(c){return WORDS.filter(w=>c==='全部'||w.cat===c)}function practiceCategory(){quizCat=category;startQuiz(false)}function practiceOne(id){quizCat=BYID[id].cat;startQuiz(false,id)}
function quizHome(){return `<section class="panel"><h2>🧠 四選一練習</h2><p class="muted">先揀分類，五題一局。答錯會自動加入弱點紀錄，亦可以隨時翻查。</p><label class="small">練習分類</label><select class="select" onchange="quizCat=this.value">${catOpts()}</select><div class="grid" style="margin-top:12px"><button class="btn" onclick="startQuiz(false)">📘 普通練習</button><button class="btn gold" onclick="startQuiz(true)">⚡ 限時練習</button></div><p class="small muted">限時模式每題10秒。免費練習不受體力限制。</p></section>`}
function startQuiz(timed=false,firstId){let a=pools(quizCat);if(a.length<4){toast('至少需要四個單字');return}let q=randomize(a).slice(0,5);if(firstId){q=q.filter(w=>w.id!==firstId);q.unshift(BYID[firstId]);q=q.slice(0,5)}quiz={questions:q,index:0,correct:0,wrong:[],timed,startAt:Date.now(),qAt:Date.now(),answered:false,ended:false};screen='quizplay';render();startQuestionTimer()}
let questionTimer;function startQuestionTimer(){clearInterval(questionTimer);if(!quiz?.timed)return;questionTimer=setInterval(()=>{if(screen!=='quizplay'||quiz.answered){clearInterval(questionTimer);return}let remaining=Math.max(0,10-Math.floor((Date.now()-quiz.qAt)/1000));if($('seconds'))$('seconds').textContent=remaining;if(remaining===0){clearInterval(questionTimer);choose(-1)}},300)}
function quizView(){let w=quiz.questions[quiz.index];if(!quiz.options||quiz.optIndex!==quiz.index){let wrong=randomize(WORDS.filter(x=>x.id!==w.id&&x.zh!==w.zh)).slice(0,3);quiz.options=randomize([w,...wrong]);quiz.optIndex=quiz.index}return `<section class="panel"><div class="row between"><b>🧠 第${quiz.index+1}／${quiz.questions.length}題</b>${quiz.timed?'<span class="tag">⏱ <span id="seconds">10</span>秒</span>':'<span class="tag">自由練習</span>'}</div><div class="progress" style="margin-top:13px"><div class="bar" style="width:${quiz.index/quiz.questions.length*100}%"></div></div><div class="focus">${esc(w.jp)}</div><p style="text-align:center;color:var(--mint)">${esc(w.reading)}</p><p style="text-align:center">呢個詞係咩意思？</p><div class="stack">${quiz.options.map((o,i)=>`<button class="option" id="op${i}" onclick="choose(${i})">${i+1}. ${esc(o.zh)}</button>`).join('')}</div><div id="feedback"></div></section>`}
function log(id,type,correct,time,extra={}){state.events.push({id,type,correct,time,at:Date.now(),...extra});if(state.events.length>5000)state.events=state.events.slice(-5000);persist()}
function choose(i){if(!quiz||quiz.answered)return;quiz.answered=true;clearInterval(questionTimer);let w=quiz.questions[quiz.index],correct=i>=0&&quiz.options[i].id===w.id;quiz.correct+=correct?1:0;if(!correct)quiz.wrong.push(w.id);log(w.id,'quiz',correct,Date.now()-quiz.qAt,{timed:quiz.timed});Array.from(document.querySelectorAll('.option')).forEach((el,j)=>{el.disabled=true;if(quiz.options[j].id===w.id)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});$('feedback').innerHTML=`<div class="notice ${correct?'':'error'}">${correct?'✅ 正確！':'❗正確答案：'+esc(w.zh)}</div><button class="btn" style="width:100%" onclick="nextQuiz()">${quiz.index===quiz.questions.length-1?'查看結果':'下一題 →'}</button>`}
function nextQuiz(){if(quiz.index===quiz.questions.length-1){quiz.ended=true;state.sessions++;state.coins+=quiz.correct*3;persist();screen='quizresult';render();return}quiz.index++;quiz.qAt=Date.now();quiz.answered=false;quiz.options=null;render();startQuestionTimer()}
function quizResult(){return `<section class="panel" style="text-align:center"><div style="font-size:66px">🏆</div><h2>練習完成！</h2><div class="score">${quiz.correct} / ${quiz.questions.length}</div><p>獲得 ${quiz.correct*3} 積分</p><div class="separator"></div><h3>今次錯題</h3>${quiz.wrong.length?quiz.wrong.map(id=>wordrow(BYID[id])).join(''):'<p>全部答啱，做得好！</p>'}<div class="stack"><button class="btn" onclick="go('record')">📊 查看學習紀錄</button><button class="btn alt" onclick="go('quiz')">再練習</button></div></section>`}
function battleHome(){return `<section class="panel"><h2>🧟 日文輸入防衛戰</h2><p>依照中文意思，用假名 Flick 或文字輸入擊退喪屍。呢個係可玩測試版，正式動畫後續升級。</p><div class="mascot">🐈 🧟</div><label class="small">單字分類</label><select class="select" onchange="battleCat=this.value">${['全部',...CATS].map(c=>`<option ${battleCat===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select><div class="row wrap" style="margin:12px 0"><button class="pill ${battleMode==='flick'?'on':''}" onclick="battleMode='flick';render()">📱 Flick</button><button class="pill ${battleMode==='type'?'on':''}" onclick="battleMode='type';render()">⌨️ 鍵盤輸入</button></div><button class="btn" style="width:100%" onclick="startBattle()">⚔️ 開始五波防衛戰</button><p class="small muted">練習不消耗體力。輸入模式以假名為目標；拼字錯誤同詞義答錯分開記錄。</p></section>`}
function startBattle(){let a=pools(battleCat);battle={questions:randomize(a).slice(0,5),index:0,hp:3,ok:0,miss:0,qAt:Date.now(),ended:false};typed='';screen='battleplay';render()}
const KANA={あ:['あ','い','う','え','お'],か:['か','き','く','け','こ'],さ:['さ','し','す','せ','そ'],た:['た','ち','つ','て','と'],な:['な','に','ぬ','ね','の'],は:['は','ひ','ふ','へ','ほ'],ま:['ま','み','む','め','も'],や:['や','や','ゆ','え','よ'],ら:['ら','り','る','れ','ろ'],わ:['わ','を','ん','ー','わ']};const VOICE={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ','ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ','だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と','ば':'ぱ','び':'ぴ','ぶ':'ぷ','べ':'ぺ','ぼ':'ぽ','ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'};const SMALL={'や':'ゃ','ゆ':'ゅ','よ':'ょ','つ':'っ','あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ'};
function battleView(){let w=battle.questions[battle.index];return `<section class="panel"><div class="row between"><b>🧟 第 ${battle.index+1}/5 波</b><b>❤️ ${battle.hp}/3</b></div><div class="arena"><span class="health">救援任務</span><span class="cat">🐈</span><span class="zombie">🧟</span></div><p style="text-align:center">請輸入呢個詞嘅假名讀音：</p><div class="focus" style="font-size:26px">${esc(w.jp)} <span class="sub">${esc(w.zh)}</span></div><div class="draft" id="draft">${esc(typed)||'輸入假名...'}</div>${battleMode==='type'?`<input class="search" id="type" placeholder="例如：がっこう" value="${esc(typed)}" oninput="typed=this.value;updateDraft()" autocapitalize="off" autocomplete="off" spellcheck="false" style="margin:12px 0">`:`<div class="kb">${['あ','か','さ','た','な','は','ま','や','ら','゛小','わ','⌫'].map(k=>`<div class="key" data-key="${k}" role="button" aria-label="${k}">${k}<small>${KANA[k]?KANA[k].slice(1).join(' '):k==='゛小'?'濁音 / 小字':'刪除'}</small></div>`).join('')}</div>`}<div class="row"><button class="btn alt grow" onclick="clearDraft()">清除</button><button class="btn grow" onclick="attack()">⚔️ 攻擊</button></div><p class="small muted">Flick：向左＝い段；上＝う段；右＝え段；下＝お段。゛小可切換濁音／小假名。</p></section>`}
function updateDraft(){let el=$('draft');if(el)el.textContent=typed||'輸入假名...'}function addKana(k){typed+=k;updateDraft()}function clearDraft(){typed='';let el=$('type');if(el)el.value='';updateDraft()}function modify(){if(!typed)return;let last=typed.slice(-1);typed=typed.slice(0,-1)+(VOICE[last]||SMALL[last]||last);updateDraft()}
function installKeys(){document.querySelectorAll('.key').forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();touch={id:e.pointerId,x:e.clientX,y:e.clientY,key:el.dataset.key};try{el.setPointerCapture(e.pointerId)}catch(e){}});el.addEventListener('pointerup',e=>{if(!touch||e.pointerId!==touch.id)return;let t=touch;touch=null;let k=t.key;if(k==='⌫'){typed=typed.slice(0,-1);updateDraft();return}if(k==='゛小'){modify();return}let vals=KANA[k];let dx=e.clientX-t.x,dy=e.clientY-t.y;let idx=Math.hypot(dx,dy)<14?0:Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?2:4);addKana(vals[idx])});el.addEventListener('pointercancel',()=>touch=null)})}
function attack(){let w=battle.questions[battle.index],ok=typed.trim()===w.reading;log(w.id,'battle',ok,Date.now()-battle.qAt,{typed:typed.trim(),target:w.reading});if(ok)battle.ok++;else{battle.miss++;battle.hp--}if(!ok)toast('讀音係：'+w.reading);else toast('命中！🎯');battle.index++;typed='';battle.qAt=Date.now();if(battle.index>=5||battle.hp<=0){battle.ended=true;state.sessions++;state.coins+=battle.ok*4;persist();screen='battleresult'}render()}
function battleResult(){return `<section class="panel" style="text-align:center"><div style="font-size:63px">${battle.hp>0?'🐱🎉':'🧟'}</div><h2>${battle.hp>0?'防衛完成！':'防線失守！'}</h2><div class="score">${battle.ok} / 5</div><p>獲得 ${battle.ok*4} 積分；讀音輸入有誤嘅詞可喺「紀錄」查看。</p><div class="grid"><button class="btn" onclick="go('record')">睇紀錄</button><button class="btn alt" onclick="go('battle')">再挑戰</button></div></section>`}
function records(){let ids=[...new Set(state.events.map(x=>x.id))],wrongs=ids.map(id=>({id,ev:state.events.filter(e=>e.id===id)})).filter(x=>x.ev.some(e=>!e.correct)).sort((a,b)=>b.ev.filter(e=>!e.correct).length-a.ev.filter(e=>!e.correct).length);let latest=[...state.events].reverse().slice(0,18);return `<section class="panel"><h2>📊 學習紀錄</h2><div class="stats"><div><b>${state.studied.length}</b><span class="small">已閱讀</span></div><div><b>${ids.length}</b><span class="small">遊戲遇過</span></div><div><b>${state.events.filter(x=>!x.correct).length}</b><span class="small">累計答錯</span></div></div><p class="small muted">紀錄儲存在此瀏覽器。暫未有跨裝置同步；每項能力須有足夠作答次數先可可靠估計。</p></section><section class="panel"><h2>❗ 最常答錯</h2>${wrongs.length?wrongs.slice(0,12).map(x=>wordrow(BYID[x.id])).join(''):'<div class="empty">未有錯題紀錄，開始練習就會出現！</div>'}</section><section class="panel"><h2>🕘 最近遇過</h2>${latest.length?latest.map(e=>`<div class="word" onclick="openWord('${e.id}')"><div class="main"><div class="jp" style="font-size:17px">${esc(BYID[e.id]?.jp||'')}</div><div class="sub">${esc(BYID[e.id]?.zh||'')} · ${e.type==='quiz'?'四選一':'喪屍戰'} · ${e.correct?'✅':'❗'} · ${new Date(e.at).toLocaleDateString('zh-HK')}</div></div><span>›</span></div>`).join(''):'<div class="empty">未有練習紀錄</div>'}</section><section class="panel"><h2>🔒 數據與私隱</h2><p class="small muted">目前資料只喺呢部裝置嘅瀏覽器儲存，清除網站資料可能令進度遺失。按以下按鈕可以匯出備份。</p><button class="btn alt" onclick="exportData()">⬇️ 匯出紀錄 JSON</button></section>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'Japanese Zombie v0.2A',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='japanese-zombie-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const STORE=[{id:'hat',name:'探險帽',em:'🎩',cost:100},{id:'scarf',name:'紅色圍巾',em:'🧣',cost:150},{id:'bag',name:'小背包',em:'🎒',cost:250},{id:'bed',name:'伙伴小床',em:'🛏️',cost:400}];function pet(){return `<section class="panel hero"><h2>🐱 伙伴避難所</h2><div class="mascot">${state.equipped.includes('hat')?'🎩':''}🐈${state.equipped.includes('scarf')?'🧣':''}</div><p style="text-align:center">今日都一齊努力學日文！</p><p style="text-align:center">🪙 ${state.coins} 積分</p></section><section class="panel"><h2>🎁 裝飾商店</h2><div class="grid">${STORE.map(o=>`<div class="tile"><div class="emoji">${o.em}</div><strong>${o.name}</strong><p class="small muted">🪙 ${o.cost}</p><button class="btn ${state.owned.includes(o.id)?'alt':'gold'}" onclick="buy('${o.id}')">${state.owned.includes(o.id)?state.equipped.includes(o.id)?'卸下':'裝備':'購買'}</button></div>`).join('')}</div><p class="small muted">所有獎勵只影響造型，唔會提高答題正確率。</p></section>`}function buy(id){let p=STORE.find(x=>x.id===id);if(!state.owned.includes(id)){if(state.coins<p.cost){toast('積分不足，做多啲練習啦！');return}state.coins-=p.cost;state.owned.push(id);state.equipped.push(id)}else state.equipped=state.equipped.includes(id)?state.equipped.filter(x=>x!==id):[...state.equipped,id];persist();render()}
const STORY=[['店員','いらっしゃいませ！','歡迎光臨！'],['伙伴','すみません。水はどこですか。','唔該，水喺邊度？'],['店員','こちらです。','喺呢邊。'],['伙伴','ありがとうございます。','多謝！']];function story(){return `<section class="panel"><h2>🏪 故事模式：便利店救援</h2><div class="mascot">🏪🐈</div><span class="tag">第${Math.min(storyStep+1,STORY.length)}／${STORY.length}句</span><div class="notice"><h3>${STORY[Math.min(storyStep,STORY.length-1)][0]}</h3><div class="jp">${STORY[Math.min(storyStep,STORY.length-1)][1]}</div><p>${STORY[Math.min(storyStep,STORY.length-1)][2]}</p></div><button class="btn" onclick="nextStory()">${storyStep>=STORY.length-1?'完成故事':'下一句 →'}</button></section>`}function nextStory(){if(storyStep>=STORY.length-1){storyStep=0;state.coins+=10;persist();toast('故事完成！＋10積分');go('home')}else{storyStep++;render()}}
render();
</script></body></html>
