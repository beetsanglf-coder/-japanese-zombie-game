<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d2d"><title>日文喪屍生存戰 · Prototype</title><style>
:root{--bg:#111827;--panel:#1e293b;--panel2:#27364b;--line:#405069;--text:#f5f7ff;--muted:#b8c4d7;--accent:#84e6bd;--yellow:#ffd781;--red:#ff8c95}*{box-sizing:border-box}body{margin:0;background:linear-gradient(165deg,#101828,#223045);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 13px;background:var(--panel2);color:var(--text);font-weight:700;touch-action:manipulation}button:disabled{opacity:.44;cursor:not-allowed}.primary{background:var(--accent);color:#0b2822}.ghost{border:1px solid var(--line);background:transparent}.warn{background:#684047}.app{max-width:520px;margin:auto;min-height:100dvh;padding:16px 15px 96px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-size:21px;font-weight:900;letter-spacing:-.5px}.sub{color:var(--muted);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#34425a;border-radius:40px;padding:7px 11px;font-size:12px}.panel{background:var(--panel);padding:17px;border:1px solid #33455c;border-radius:20px;margin-bottom:13px;box-shadow:0 8px 26px #04091315}.title{font-size:21px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.6}.flex{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:9px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big{font-size:30px;font-weight:900}.hero{background:radial-gradient(circle at 85% 10%,#536d6a,#263751 55%,#202a40);position:relative;overflow:hidden}.mascot{font-size:78px;text-align:center;filter:drop-shadow(0 8px 4px #0005)}.stat{padding:10px;border-radius:12px;background:#2c3b50;text-align:center}.stat b{display:block;font-size:20px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#152034f5;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #43516b;z-index:10}.nav button{padding:7px 1px;font-size:11px;background:transparent}.nav button.active{color:var(--accent);background:#283c47}.nav button span{display:block;font-size:21px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#2b394e;padding:16px}.choice.correct{border-color:var(--accent);background:#275544}.choice.wrong{border-color:var(--red);background:#66353d}.progress{height:9px;background:#35435a;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.battlefield{height:180px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(#536c78 0 55%,#536851 55% 65%,#50515a 65%);border:2px solid #71818a}.skyline{position:absolute;inset:0 0 35%;opacity:.5;background:linear-gradient(to right,transparent 0 7%,#2b3b53 7% 20%,transparent 20% 27%,#2b3b53 27% 43%,transparent 43% 59%,#2b3b53 59% 73%,transparent 73% 79%,#2b3b53 79% 91%,transparent 91%)}.avatar{position:absolute;bottom:20px;left:6px;font-size:48px;z-index:2}.zombie{position:absolute;bottom:22px;font-size:43px;transition:left .1s linear}.zlabel{position:absolute;bottom:78px;white-space:nowrap;background:#172237f0;padding:5px 12px;border-radius:11px;border:1px solid #9fb7a9;font-size:19px;font-weight:900}.fieldlabel{font-size:12px;color:var(--muted)}.answer{background:#111e30;border:1px solid #51677c;border-radius:12px;padding:10px;min-height:49px;font-size:23px;text-align:center;letter-spacing:1px}.keyboard{touch-action:none;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{background:#dbe4ed;color:#182b42;border-radius:12px;height:56px;display:flex;align-items:center;justify-content:center;font-size:23px;position:relative;touch-action:none;box-shadow:0 3px 0 #a4b4c2;font-weight:800}.key.active{background:#fff5ba;transform:translateY(2px);box-shadow:0 1px 0 #a4b4c2}.key.special{background:#a8cdd1;font-size:18px}.flickbubble{position:fixed;z-index:99;padding:13px 20px;border-radius:15px;background:#fef0ba;color:#18283e;border:2px solid #fff;font-size:26px;font-weight:900;pointer-events:none;transform:translate(-50%,-105%);box-shadow:0 6px 22px #0007}.seg{display:flex;border-radius:14px;background:#34455e;padding:3px;gap:4px}.seg button{flex:1;padding:9px 6px;background:transparent;font-size:13px}.seg button.sel{background:var(--accent);color:#143327}.input{width:100%;background:#101d2f;color:white;border:1px solid #64758b;border-radius:12px;padding:13px;font-size:21px}.notice{padding:11px;background:#354253;border-radius:12px;font-size:13px;line-height:1.6}.tag{border-radius:8px;background:#34485c;padding:5px 8px;font-size:11px}.shopitem{text-align:center;background:#293a4f;border-radius:14px;padding:13px 8px}.itememoji{font-size:45px}.hidden{display:none!important}h3{margin:0 0 10px}p{line-height:1.6}#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#ecffef;color:#173627;padding:11px 17px;border-radius:12px;z-index:150;max-width:90%;font-weight:800;box-shadow:0 9px 25px #0008;display:none;text-align:center}.kbdhint{font-size:11px;color:#bdd1da;line-height:1.5;margin:6px 0}.scroll{max-height:340px;overflow:auto} .scene{font-size:86px;text-align:center;padding:16px;background:linear-gradient(135deg,#4b5a6d,#25334f);border-radius:16px}.linklike{color:var(--accent);text-decoration:underline;cursor:pointer}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><div id="app" class="app"></div><div id="toast" role="status"></div><script>
const WORDS=[{id:'apple',jp:'りんご',zh:'蘋果',en:'apple',rom:'ringo',hint:'🍎',sentence:'りんごを食べます。',explain:'「を」標記動作嘅對象。'},{id:'cat',jp:'ねこ',zh:'貓',en:'cat',rom:'neko',hint:'🐱',sentence:'ねこがいます。',explain:'「が」可以用嚟標記存在嘅主體。'},{id:'dog',jp:'いぬ',zh:'狗',en:'dog',rom:'inu',hint:'🐶',sentence:'いぬが好きです。',explain:'「好きです」表示喜歡。'},{id:'water',jp:'みず',zh:'水',en:'water',rom:'mizu',hint:'💧',sentence:'水を飲みます。',explain:'「飲みます」即飲。'},{id:'sky',jp:'そら',zh:'天空',en:'sky',rom:'sora',hint:'☁️',sentence:'空が青いです。',explain:'「青い」係い形容詞。'},{id:'school',jp:'がっこう',zh:'學校',en:'school',rom:'gakkou',hint:'🏫',sentence:'学校へ行きます。',explain:'「へ」表示移動方向，讀作「え」。'},{id:'today',jp:'きょう',zh:'今日',en:'today',rom:'kyou',hint:'📅',sentence:'今日は暑いです。',explain:'「は」作助詞時讀 wa。'},{id:'book',jp:'ほん',zh:'書',en:'book',rom:'hon',hint:'📚',sentence:'本を読みます。',explain:'「読みます」表示閱讀。'},{id:'train',jp:'でんしゃ',zh:'電車',en:'train',rom:'densha',hint:'🚆',sentence:'電車に乗ります。',explain:'「に乗ります」表示乘搭。'},{id:'vegetable',jp:'やさい',zh:'蔬菜',en:'vegetables',rom:'yasai',hint:'🥬',sentence:'野菜を買います。',explain:'「買います」表示購買。'}];
const STORE=[{id:'hat',name:'探險帽',emoji:'🎩',cost:100},{id:'scarf',name:'紅色圍巾',emoji:'🧣',cost:150},{id:'bag',name:'小背包',emoji:'🎒',cost:250},{id:'bed',name:'伙伴小床',emoji:'🛏️',cost:400}];
const defaultState=()=>({coins:120,energy:5,energyAt:Date.now(),bonus:2,owned:[],equipped:[],firstClear:false,quizCount:0,battleCount:0,learned:[],records:[],storyDone:false,daily:{date:'',quiz:false,study:false}});
let state;try{state={...defaultState(),...JSON.parse(localStorage.getItem('jp-zombie-v1')||'{}')}}catch{state=defaultState()};
let screen='home',quiz=null,battle=null,storyIndex=0,mode='flick',draft='',activeTouch=null,bubble=null,timer=null,finished=null;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('jp-zombie-v1',JSON.stringify(state))}function toast(s){let n=$('toast');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2200)};
function recharge(){let now=Date.now(),n=Math.floor((now-state.energyAt)/1800000);if(n>0){state.energy=Math.min(5,state.energy+n);state.energyAt+=n*1800000;if(state.energy===5)state.energyAt=now;save()}}function spend(){recharge();if(!state.firstClear)return true;if(state.energy>0){state.energy--;save();return true}if(state.bonus>0){state.bonus--;save();return true}toast('體力不足！可以先免費學習，或者等體力回復。');return false}
function award(n,msg){state.coins+=n;save();toast((msg||'獲得獎勵')+' ＋'+n+'積分')}
function header(){recharge();return `<header class="header"><div><div class="brand">🐾 日文喪屍生存戰</div><div class="sub">可玩概念版 v0.1 · 進度儲存於本機</div></div><div class="chips"><div class="chip">🪙 ${state.coins}</div><div class="chip">⚡ ${state.energy}/5 <span class="muted">+${state.bonus}</span></div></div></header>`}
function nav(){return `<nav class="nav">${[['home','首頁','🏠'],['study','學習','📖'],['quiz','問答','🧠'],['battle','喪屍','🧟'],['shop','伙伴','🐱']].map(([id,t,ico])=>`<button class="${screen===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${t}</button>`).join('')}</nav>`}
function render(){if(timer){clearInterval(timer);timer=null}let content='';if(screen==='home')content=home();if(screen==='study')content=study();if(screen==='quiz')content=quizHome();if(screen==='battle')content=battleHome();if(screen==='story')content=storyHome();if(screen==='shop')content=shop();if(screen==='playQuiz')content=quizView();if(screen==='playBattle')content=battleView();if(screen==='result')content=resultView();$('app').innerHTML=header()+content+nav();if(screen==='playQuiz'&&quiz&&!quiz.ended&&quiz.timed)setupQuizTimer();if(screen==='playBattle'&&battle&&!battle.ended)setupBattleTimer();}
function go(s){if(screen==='playBattle'&&battle&&!battle.ended){battle.ended=true}if(screen==='playQuiz'&&quiz&&!quiz.ended){quiz.ended=true}screen=s;render()}
function home(){let novice=!state.firstClear;return `<section class="panel hero"><div class="flex between"><div><div class="tag" style="display:inline-block">第一章 · 便利店危機</div><h1 style="font-size:26px;max-width:240px">學日文，守護你嘅伙伴！</h1><p class="small">先學單字，再考記憶，用 Flick 打倒喪屍。</p></div><div class="mascot">🐈</div></div><button class="primary" onclick="go('study')">開始學習 →</button></section><section class="panel"><h3>🎮 三種模式</h3><div class="stack"><button class="choice" onclick="go('quiz')">🧠 四選一問答　<span class="sub">不限時／限時</span></button><button class="choice" onclick="go('battle')">🧟 喪屍打字戰　<span class="sub">Flick／Romaji</span></button><button class="choice" onclick="go('story')">📜 故事冒險　<span class="sub">便利店對話</span></button></div></section><section class="panel"><h3>🎯 每日學習</h3><div class="small muted">每日首次完成一組免費問答可獲得額外體力。練習資料會留喺呢部裝置。</div><p>目前已練習 <b>${state.records.length}</b> 次題目 · 已學習 <b>${state.learned.length}</b> 個詞</p><div class="notice">${novice?'🎁 新手保障進行中：第一場喪屍戰可免費挑戰，完成後再啟動普通體力規則。':'⏰ 每30分鐘回復1體力（自然上限5）；免費學習一直開放。'}</div></section><section class="panel"><h3>📈 最近學習表現</h3>${progressSummary()}<button class="ghost" onclick="showOverall()">查看詳細學習成果</button></section>`}
function study(){let cards=WORDS.map(w=>`<details class="panel"><summary style="cursor:pointer"><b style="font-size:22px">${w.hint} ${w.jp}</b>　<span class="muted">${w.zh}</span></summary><p><b>${w.rom}</b> · ${w.en}</p><p>${w.sentence}</p><p class="small muted">${w.explain}</p><button class="primary" onclick="event.preventDefault();markStudied('${w.id}')">已學識／完成溫習 ＋2分</button></details>`).join('');return `<section class="panel"><h2 class="title">📖 學習營地</h2><p class="small muted">免費不限時。例句與文法解釋為試作內容，可擴充完整題庫。</p><div class="notice">🍱 文化小知識：喺日本便利店，店員常問「袋はご利用ですか？」意思係「需要購物袋嗎？」</div></section>${cards}`}
function markStudied(id){if(!state.learned.includes(id)){state.learned.push(id);award(2,'新單字')}else toast('已完成複習！');save();render()}
function quizHome(){return `<section class="panel"><h2>🧠 四選一問答</h2><p class="muted small">測試辨識單字，唔需要打字。答啱一次唔代表已完全掌握。</p><div class="stack"><button class="choice" onclick="startQuiz(false)">🌿 普通學習 · 不限時<br><span class="sub">永遠免費；適合慢慢理解、複習</span></button><button class="choice" onclick="startQuiz(true)">⚡ 極速挑戰 · 每題10秒<br><span class="sub">耗1體力；新手第一場可免費</span></button></div></section>`}
function startQuiz(timed){if(timed&&!spend())return;let questions=[...WORDS].sort(()=>Math.random()-.5).slice(0,5);quiz={timed,questions,index:0,score:0,ended:false,started:Date.now(),startQ:Date.now(),remaining:10,history:[]};screen='playQuiz';render()}
function options(w){let wrong=WORDS.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);return [w,...wrong].sort(()=>Math.random()-.5)}
function quizView(){let w=quiz.questions[quiz.index];if(!quiz.opts||quiz.optIndex!==quiz.index){quiz.opts=options(w);quiz.optIndex=quiz.index}return `<section class="panel"><div class="flex between"><b>${quiz.timed?'⚡ 極速挑戰':'🌿 普通學習'}</b><span>${quiz.index+1} / ${quiz.questions.length}</span></div><div class="progress" style="margin:12px 0"><div style="width:${quiz.index/quiz.questions.length*100}%"></div></div>${quiz.timed?`<p>⏱️ 剩餘 <b id="countdown">${quiz.remaining}</b> 秒</p>`:''}<div class="stat" style="padding:30px"><div class="muted small">請選擇正確嘅日文</div><div class="big">${w.zh}</div><div style="font-size:34px">${w.hint}</div></div><div class="twocol" style="margin-top:12px">${quiz.opts.map((o,i)=>`<button class="choice" onclick="answerQuiz(${i})">${o.jp}</button>`).join('')}</div><div id="quizfeedback" class="small muted" style="padding-top:12px"></div></section>`}
function setupQuizTimer(){timer=setInterval(()=>{if(screen!=='playQuiz'||quiz.ended)return;quiz.remaining=Math.max(0,10-Math.floor((Date.now()-quiz.startQ)/1000));if($('countdown'))$('countdown').textContent=quiz.remaining;if(quiz.remaining<=0){clearInterval(timer);answerQuiz(-1)}},160)}
function answerQuiz(i){if(!quiz||quiz.ended||quiz.locked)return;quiz.locked=true;clearInterval(timer);timer=null;let w=quiz.questions[quiz.index],correct=i>=0&&quiz.opts[i].id===w.id,elapsed=Date.now()-quiz.startQ;quiz.history.push({id:w.id,mode:'choice',correct,elapsed,assisted:false,time:Date.now()});if(correct)quiz.score++;let f=$('quizfeedback');if(f)f.innerHTML=`<div class="notice">${correct?'✅ 答啱！':'📘 正確答案係 '+w.jp} ${w.sentence}<br>${w.explain}</div>`;setTimeout(()=>{if(!quiz||screen!=='playQuiz')return;quiz.index++;quiz.locked=false;quiz.remaining=10;quiz.startQ=Date.now();if(quiz.index>=quiz.questions.length){state.records.push(...quiz.history);state.quizCount++;rewardQuiz(quiz);finish({type:'問答練習',correct:quiz.score,total:quiz.questions.length,records:quiz.history,coins:quiz.timed?30:20})}else render()},1000)}
function rewardQuiz(q){if(q.timed)state.coins+=30;else state.coins+=20;const d=new Date().toLocaleDateString('sv-SE');if(state.daily.date!==d)state.daily={date:d,quiz:false,study:false};if(!q.timed&&!state.daily.quiz){state.daily.quiz=true;state.bonus+=1;toast('每日任務完成！額外獲得1張挑戰券')}save()}
function battleHome(){return `<section class="panel"><h2>🧟 喪屍打字生存戰</h2><p class="muted small">用 Flick 或 Romaji 輸入日文讀音，喪屍向你行近。第一場有新手保障。</p><div class="seg"><button class="${mode==='flick'?'sel':''}" onclick="mode='flick';render()">日文 Flick</button><button class="${mode==='romaji'?'sel':''}" onclick="mode='romaji';render()">Romaji</button></div><div class="notice" style="margin:12px 0">Flick：撳住假名鍵，向左／上／右／下滑動；濁音用「゛小」鍵轉換。第一次玩建議先試「ねこ」。</div><button class="primary" style="width:100%" onclick="startBattle()">開始戰鬥 ${state.firstClear?'⚡ -1':'🎁 新手免費'}</button></section>`}
function startBattle(){if(!spend())return;battle={words:[WORDS[1],WORDS[3],WORDS[0],WORDS[5]],index:0,health:3,position:91,correct:0,ended:false,history:[],startQ:Date.now(),start:Date.now(),corrections:0};draft='';screen='playBattle';render()}
function battleView(){let w=battle.words[battle.index];return `<section class="panel"><div class="flex between"><b>🧟 第一章 · 試玩戰</b><span>❤️ ${battle.health}/3</span></div><p class="small muted">敵人 ${battle.index+1} / ${battle.words.length}　·　答對即攻擊</p><div class="battlefield" id="field"><div class="skyline"></div><div class="avatar">🐈</div><div class="zlabel" id="zlabel" style="left:${battle.position}%">${w.jp}</div><div class="zombie" id="zombie" style="left:${battle.position}%">🧟</div></div><div style="margin:10px 0"><div class="fieldlabel">輸入日文讀音：<b>${w.jp}</b>　<span class="muted">${w.zh}</span></div><div class="answer" id="answer">${esc(draft)||'＿'}</div></div><div class="seg" style="margin-bottom:9px"><button class="${mode==='flick'?'sel':''}" onclick="switchMode('flick')">Flick</button><button class="${mode==='romaji'?'sel':''}" onclick="switchMode('romaji')">Romaji</button></div>${mode==='flick'?keyboardHTML():`<input id="rominput" class="input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="latin" placeholder="例如 neko" value="${esc(draft)}" oninput="setRomaji(this.value)">`}<div class="flex between" style="margin-top:9px"><button class="ghost" onclick="backspace()">⌫ 刪除</button><button class="ghost" onclick="draft='';updateDraft()">清除</button><button class="primary" onclick="submitBattle()">攻擊 ➜</button></div><div class="kbdhint">打錯可以先刪除修正；不會立即判定你唔識日文。試作版用「攻擊」按鈕提交。</div></section>`}
const rows={あ:['あ','い','う','え','お'],か:['か','き','く','け','こ'],さ:['さ','し','す','せ','そ'],た:['た','ち','つ','て','と'],な:['な','に','ぬ','ね','の'],は:['は','ひ','ふ','へ','ほ'],ま:['ま','み','む','め','も'],や:['や','や','ゆ','や','よ'],ら:['ら','り','る','れ','ろ'],わ:['わ','を','ん','ー','わ']};
function keyboardHTML(){return `<div class="keyboard" id="keyboard">${['あ','か','さ','た','な','は','ま','や','ら','゛小','わ','⌫'].map(k=>`<div role="button" aria-label="${k}" class="key ${rows[k]?'':'special'}" data-key="${k}">${k}</div>`).join('')}</div><div class="kbdhint">左＝い段、上＝う段、右＝え段、下＝お段；「゛小」可以將 か→が、つ→っ、や→ゃ。</div>`}
const voiced={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','ば':'ぱ','び':'ぴ','ぶ':'ぷ','べ':'ぺ','ぼ':'ぽ','や':'ゃ','ゆ':'ゅ','よ':'ょ','つ':'っ','あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ'};
function addKana(k){draft+=k;updateDraft()}function backspace(){draft=draft.slice(0,-1);if(battle)battle.corrections++;updateDraft()}function modifyKana(){if(!draft)return;let last=draft.slice(-1);draft=draft.slice(0,-1)+(voiced[last]||last);updateDraft()};function updateDraft(){if($('answer'))$('answer').textContent=draft||'＿';if(mode==='romaji'&&$('rominput'))$('rominput').value=draft}function setRomaji(v){draft=v.toLowerCase();updateDraft()}function switchMode(m){mode=m;draft='';render()}
function submitBattle(){if(!battle||battle.ended)return;let w=battle.words[battle.index],correct=mode==='flick'?draft===w.jp:romajiValid(draft,w);if(!correct){toast('未匹配，試吓修正再攻擊。');return}battle.correct++;battle.history.push({id:w.id,mode:'typing',correct:true,elapsed:Date.now()-battle.startQ,inputDuration:Date.now()-battle.startQ,corrections:battle.corrections,time:Date.now(),inputMethod:mode,shownAnswer:true});battle.index++;draft='';battle.corrections=0;battle.position=91;battle.startQ=Date.now();if(battle.index>=battle.words.length){battle.ended=true;state.records.push(...battle.history);state.battleCount++;state.coins+=30;if(!state.firstClear){state.firstClear=true;state.bonus+=3}save();finish({type:'喪屍生存戰',correct:battle.correct,total:battle.words.length,records:battle.history,coins:30});return}render()}
function romajiValid(s,w){let map={school:['gakkou','gakko'],today:['kyou','kyo'],apple:['ringo'],cat:['neko'],dog:['inu'],water:['mizu'],sky:['sora'],book:['hon'],train:['densha'],vegetable:['yasai']};return (map[w.id]||[w.rom]).includes(s.toLowerCase().trim())}
function setupBattleTimer(){timer=setInterval(()=>{if(!battle||battle.ended||screen!=='playBattle')return;battle.position-=.16;if($('zombie'))$('zombie').style.left=battle.position+'%';if($('zlabel'))$('zlabel').style.left=battle.position+'%';if(battle.position<=14){battle.health--;battle.history.push({id:battle.words[battle.index].id,mode:'typing',correct:false,elapsed:Date.now()-battle.startQ,corrections:battle.corrections,time:Date.now(),inputMethod:mode,shownAnswer:true});battle.index++;battle.position=91;draft='';battle.corrections=0;battle.startQ=Date.now();if(battle.health<=0||battle.index>=battle.words.length){battle.ended=true;state.records.push(...battle.history);state.battleCount++;state.coins+=10;if(!state.firstClear){state.firstClear=true;state.bonus+=3}save();finish({type:'喪屍生存戰',correct:battle.correct,total:battle.history.length,records:battle.history,coins:10})}else render()}},100)}
function storyHome(){return `<section class="panel"><h2>📜 故事模式：最後一間便利店</h2><div class="scene">🏪🐈🧟</div><p class="small">喪屍爆發後，貓貓走進一間便利店尋找水。試吓用日文處理日常對話。</p><button class="primary" onclick="storyIndex=0;screen='story';renderStory()">${state.storyDone?'重玩短篇故事':'開始故事'} →</button><div id="storyBody"></div></section>`}
const STORY=[{speaker:'便利店店員',jp:'いらっしゃいませ！',zh:'歡迎光臨！',opts:['表示歡迎顧客','問你住喺邊'],right:0,explain:'店員接待客人常用「いらっしゃいませ」。'},{speaker:'便利店店員',jp:'袋はご利用ですか？',zh:'你聽到店員問你一句日文。',opts:['問你需唔需要袋','問你要唔要搭電車'],right:0,explain:'喺日本便利店，「袋」係購物袋。'},{speaker:'貓貓',jp:'いいえ、大丈夫です。',zh:'你唔需要袋，呢句係咪合適？',opts:['合適，意思係唔使，多謝','唔合適，意思係買兩個'],right:0,explain:'「大丈夫です」喺呢個情境表示「唔使／冇問題」。'}];
function renderStory(){let host=$('storyBody');if(!host)return;let st=STORY[storyIndex];if(!st){if(!state.storyDone){state.storyDone=true;award(50,'故事通關')}host.innerHTML=`<div class="notice">🎉 故事完成！你學識咗日本便利店嘅基本對話。</div><button class="ghost" onclick="go('home')">返回首頁</button>`;return}host.innerHTML=`<div class="panel" style="margin-top:12px"><div class="small muted">${st.speaker} · ${storyIndex+1}/3</div><h2>${st.jp}</h2><p>${st.zh}</p><div class="stack">${st.opts.map((x,i)=>`<button class="choice" onclick="pickStory(${i})">${x}</button>`).join('')}</div><div id="storyFeedback"></div></div>`}
function pickStory(i){let st=STORY[storyIndex];$('storyFeedback').innerHTML=`<div class="notice" style="margin-top:10px">${i===st.right?'✅ 正確！':'📖 再學一學：'} ${st.explain}</div><button style="margin-top:10px" class="primary" onclick="storyIndex++;renderStory()">繼續故事 →</button>`}
function shop(){return `<section class="panel hero"><h2>🐱 伙伴避難所</h2><div class="mascot">🐈</div><p style="text-align:center">${state.equipped.map(id=>STORE.find(x=>x.id===id)?.emoji).join(' ')} ${state.equipped.length===0?'你可以幫伙伴買第一件裝飾！':''}</p><div class="flex between"><b>遊戲積分 🪙 ${state.coins}</b><span class="tag">免費伙伴</span></div></section><section class="panel"><h3>🛍️ 積分裝飾商店</h3><div class="twocol">${STORE.map(x=>`<div class="shopitem"><div class="itememoji">${x.emoji}</div><b>${x.name}</b><div class="small muted">🪙 ${x.cost}</div><button class="${state.owned.includes(x.id)?'ghost':'primary'}" style="margin-top:8px;width:100%" onclick="buy('${x.id}')" ${!state.owned.includes(x.id)&&state.coins<x.cost?'disabled':''}>${state.owned.includes(x.id)?state.equipped.includes(x.id)?'卸下':'裝備':'兌換'}</button></div>`).join('')}</div></section><section class="panel"><h3>🔒 額外伙伴（商業版規劃）</h3><p>🐰 兔仔　🐕 柴犬　🐉 小龍</p><p class="small muted">正式版可以透過 App 內購買永久解鎖。今個 Prototype 並無實際收費功能。</p></section>`}
function buy(id){let item=STORE.find(x=>x.id===id);if(state.owned.includes(id)){state.equipped=state.equipped.includes(id)?state.equipped.filter(x=>x!==id):[...state.equipped,id]}else if(state.coins>=item.cost){state.coins-=item.cost;state.owned.push(id);state.equipped.push(id);toast('成功兌換 '+item.name)}save();render()}
function finish(obj){finished=obj;screen='result';render()}
function progressSummary(){let data=analysis();return `<p class="small">✅ 表現較穩定：<b>${data.steady.length}</b> 個　📖 建議複習：<b>${data.review.length}</b> 個</p><p class="small muted">目前屬早期測試資料；唔會因為答啱一次就判定「熟練掌握」。</p>`}
function analysis(){let arr=WORDS.map(w=>{let r=state.records.filter(x=>x.id===w.id),choice=r.filter(x=>x.mode==='choice'),positive=choice.filter(x=>x.correct),slow=positive.length>=2&&positive.reduce((sum,x)=>sum+x.elapsed,0)/positive.length>5000;return {w,r,choice,positive,slow}});return {steady:arr.filter(x=>x.positive.length>=3&&x.positive.length===x.choice.length&&!x.slow),review:arr.filter(x=>x.choice.some(y=>!y.correct)||x.slow),uncertain:arr.filter(x=>x.choice.length<3&&!x.choice.some(y=>!y.correct))}}
function resultView(){let a=analysis();return `<section class="panel"><div style="text-align:center;font-size:48px">🏆</div><h2 style="text-align:center">${finished.type}完成！</h2><div class="twocol"><div class="stat"><b>${finished.correct}/${finished.total}</b><span class="small">完成題目</span></div><div class="stat"><b>+${finished.coins}</b><span class="small">裝飾積分</span></div></div><h3 style="margin-top:22px">📚 學習成果</h3><div class="threecol"><div class="stat"><b>${a.steady.length}</b><span class="small">表現穩定</span></div><div class="stat"><b>${a.review.length}</b><span class="small">建議複習</span></div><div class="stat"><b>${a.uncertain.length}</b><span class="small">資料不足</span></div></div><p class="small muted">速度、提示、錯誤需要多次比較；喪屍戰顯示答案時只會記作輸入訓練，唔直接當成詞義已掌握。</p><h3>本局單字</h3><div class="scroll">${finished.records.map(x=>{let w=WORDS.find(y=>y.id===x.id);return `<div class="notice" style="margin-bottom:7px"><b>${w.jp}</b> · ${w.zh}　${x.correct?'✅':'📖'}<br><span class="muted">${x.mode==='choice'?'作答時間 '+(x.elapsed/1000).toFixed(1)+'秒':'輸入練習 '+(x.elapsed/1000).toFixed(1)+'秒'}</span></div>`}).join('')}</div><button class="primary" style="width:100%;margin-top:12px" onclick="go('home')">返回首頁</button></section>`}
function showOverall(){finished={type:'累積學習報告',correct:state.records.filter(x=>x.correct).length,total:state.records.length,records:state.records.slice(-15),coins:0};screen='result';render()}
// Native feeling flick input implemented through pointer gestures on our own in-game keyboard.
document.addEventListener('pointerdown',e=>{let key=e.target.closest('.key');if(!key||screen!=='playBattle'||mode!=='flick')return;let k=key.dataset.key;activeTouch={id:e.pointerId,key:k,x:e.clientX,y:e.clientY,node:key};key.classList.add('active');try{key.setPointerCapture(e.pointerId)}catch{}if(rows[k]){bubble=document.createElement('div');bubble.className='flickbubble';bubble.textContent=k;bubble.style.left=e.clientX+'px';bubble.style.top=(e.clientY-17)+'px';document.body.appendChild(bubble)}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!activeTouch||activeTouch.id!==e.pointerId)return;let t=activeTouch;if(!rows[t.key])return;let dx=e.clientX-t.x,dy=e.clientY-t.y,val=flickValue(t.key,dx,dy);if(bubble){bubble.textContent=val;bubble.style.left=e.clientX+'px';bubble.style.top=(e.clientY-18)+'px'}});
document.addEventListener('pointerup',e=>{if(!activeTouch||activeTouch.id!==e.pointerId)return;let t=activeTouch;t.node.classList.remove('active');activeTouch=null;if(bubble){bubble.remove();bubble=null}let dx=e.clientX-t.x,dy=e.clientY-t.y;if(t.key==='⌫')backspace();else if(t.key==='゛小')modifyKana();else if(rows[t.key])addKana(flickValue(t.key,dx,dy));e.preventDefault()});
document.addEventListener('pointercancel',()=>{if(activeTouch){activeTouch.node.classList.remove('active');activeTouch=null}if(bubble){bubble.remove();bubble=null}});
function flickValue(k,dx,dy){let choices=rows[k];if(Math.hypot(dx,dy)<14)return choices[0];let ix=Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?2:4);return choices[ix]}
render();
</script></body></html>
